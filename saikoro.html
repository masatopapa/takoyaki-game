        background-size: contain;
        background-position: center;
        background-repeat: no-repeat;
        filter: drop-shadow(2px 4px 5px rgba(0,0,0,0.4));
        transition: top 0.4s ease-in-out, left 0.4s ease-in-out;
        transform: translate(-50%, -50%);
        z-index: 10;
    }

    /* 3Dサイコロ */
    .scene {
        position: absolute;
        top: 50%; left: 50%;
        width: 120px;
        height: 120px;
        transform: translate(-50%, -50%);
        perspective: 600px;
        display: none; 
        z-index: 20;
    }
    .cube {
        width: 100%; height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 2s ease-out; 
    }
    .cube__face {
        position: absolute; width: 120px; height: 120px;
        background: #fffdfa; border: 2px solid #ccc; border-radius: 15px;
        font-size: 100px; display: flex; justify-content: center; align-items: center;
        color: #333; box-sizing: border-box;
    }
    .cube__face--front  { color: #e60000; transform: rotateY(  0deg) translateZ(60px); }
    .cube__face--top    { transform: rotateX( 90deg) translateZ(60px); }
    .cube__face--right  { transform: rotateY( 90deg) translateZ(60px); }
    .cube__face--left   { transform: rotateY(-90deg) translateZ(60px); }
    .cube__face--bottom { transform: rotateX(-90deg) translateZ(60px); }
    .cube__face--back   { transform: rotateY(180deg) translateZ(60px); }

    /* ボタン配置用のコンテナ */
    .controls {
        margin-top: 20px;
        display: flex;
        align-items: center;
        gap: 80px; 
    }

    /* サイコロを振るボタン */
    #roll-btn {
        padding: 15px 50px;
        font-size: 24px;
        font-weight: bold;
        background-color: #ff6600;
        color: white;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 6px 10px rgba(0,0,0,0.2);
    }
    #roll-btn:hover { background-color: #e65c00; }
    #roll-btn:disabled { background-color: #aaa; cursor: not-allowed; }

    /* 戻るボタン */
    #back-btn {
        padding: 10px 30px;
        font-size: 18px;
        background-color: #999;
        color: white;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    #back-btn:hover { background-color: #777; }
    #back-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<div id="board-container">
    <div id="highlight-circle"></div>
    <div id="koma"></div>
    <div class="scene" id="dice-scene">
        <div class="cube" id="dice">
            <div class="cube__face cube__face--front">⚀</div>
            <div class="cube__face cube__face--top">⚁</div>
            <div class="cube__face cube__face--right">⚂</div>
            <div class="cube__face cube__face--left">⚃</div>
            <div class="cube__face cube__face--bottom">⚄</div>
            <div class="cube__face cube__face--back">⚅</div>
        </div>
    </div>
</div>

<div class="controls">
    <button id="roll-btn">サイコロを振る！</button>
    <button id="back-btn">1つ戻る</button>
</div>

<script>
    const pathCoordinates = [
        { x: 8, y: 15 }, { x: 21.5, y: 11 }, { x: 33, y: 11 }, { x: 50, y: 12.5 }, 
        { x: 62.5, y: 11 }, { x: 71.5, y: 11 }, { x: 82, y: 14 }, { x: 91, y: 20 }, 
        { x: 93, y: 35 }, { x: 93, y: 49 }, { x: 92.5, y: 67 }, { x: 91.5, y: 84 }, 
        { x: 80, y: 90 }, { x: 70, y: 90 }, { x: 60, y: 90 }, { x: 50, y: 88 }, 
        { x: 36, y: 90 }, { x: 22, y: 90 }, { x: 8, y: 88 }, { x: 7.5, y: 67 },  
        { x: 7.5, y: 50 }, { x: 7.5, y: 33.5 } 
    ];

    let currentPosition = 0;
    let history = [0];

    const koma = document.getElementById('koma');
    const highlightCircle = document.getElementById('highlight-circle');
    const rollBtn = document.getElementById('roll-btn');
    const backBtn = document.getElementById('back-btn');
    const scene = document.getElementById('dice-scene');
    const cube = document.getElementById('dice');

    function updateKomaPosition() {
        const pos = pathCoordinates[currentPosition];
        koma.style.left = pos.x + '%';
        koma.style.top = pos.y + '%';
    }
    
    function showHighlight() {
        const pos = pathCoordinates[currentPosition];
        highlightCircle.style.left = pos.x + '%';
        highlightCircle.style.top = pos.y + '%';
        highlightCircle.style.display = 'block';
    }

    updateKomaPosition();
    showHighlight();

    backBtn.addEventListener('click', () => {
        if (rollBtn.disabled || history.length <= 1) return; 
        
        highlightCircle.style.display = 'none';
        currentPosition = history.pop();
        
        updateKomaPosition();
        setTimeout(showHighlight, 400); 
    });

    rollBtn.addEventListener('click', () => {
        rollBtn.disabled = true;
        backBtn.disabled = true; 
        highlightCircle.style.display = 'none'; 
        scene.style.display = 'block';

        cube.style.transition = 'none';
        cube.style.transform = 'rotateX(0deg) rotateY(0deg)';
        void cube.offsetWidth;

        const finalResult = Math.floor(Math.random() * 6) + 1;
        let rotX = 360 * 3; 
        let rotY = 360 * 3;

        switch(finalResult) {
            case 1: rotX += 0;   rotY += 0;   break;
            case 2: rotX += -90; rotY += 0;   break;
            case 3: rotX += 0;   rotY += -90; break;
            case 4: rotX += 0;   rotY += 90;  break;
            case 5: rotX += 90;  rotY += 0;   break;
            case 6: rotX += 180; rotY += 0;   break;
        }

        cube.style.transition = 'transform 2s ease-out';
        cube.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;

        setTimeout(() => {
            scene.style.display = 'none';
            history.push(currentPosition);
            moveKoma(finalResult);
        }, 3000); 
    });

    function moveKoma(steps) {
        let stepsTaken = 0;
        const moveInterval = setInterval(() => {
            currentPosition = (currentPosition + 1) % pathCoordinates.length;
            updateKomaPosition();
            stepsTaken++;

            if (stepsTaken >= steps) {
                clearInterval(moveInterval);
                showHighlight();       
                rollBtn.disabled = false; 
                backBtn.disabled = false; 
            }
        }, 500); 
    }
</script>
</body>
</html>
