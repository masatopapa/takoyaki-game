  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:"Hiragino Maru Gothic ProN","BIZ UDGothic","Yu Gothic UI","Segoe UI",Tahoma,Verdana,sans-serif;
    background:#fff3e0; color:#333; -webkit-user-select:none; user-select:none;
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* ===== スマホを縦に持ったときの横向き表示 =====
     画面全体を #app で包み、縦持ちのときは下のスクリプトが .rot を付けて90度回す（本体の回転ロックがONでも横向きになる）。
     回転中は vw/vh が「回す前の画面」の幅・高さを指してしまうので、長さの単位は #app 基準の cqw/cqh にそろえてある
     （container-type:size。回転時は cqw＝画面の実際の縦の長さ）。テスト用に ?rot で強制、?norot で回さない */
  #app{ flex:1 1 auto; min-height:0; width:100%; display:flex; flex-direction:column; overflow:hidden; container-type:size; }
  #app.rot{
    position:absolute; left:0; top:0; width:var(--rot-w); height:var(--rot-h);
    transform:rotate(90deg) translateY(-100%); transform-origin:left top;
  }
  button{ font-family:inherit; cursor:pointer; border:none; }
  button:disabled{ cursor:default; }
  input{ font-family:inherit; }

  /* ===== ヘッダー ===== */
  header{
    background:#e64a19; color:#fff; padding:.7cqh 1.2cqw; display:flex; align-items:center;
    gap:.8cqw; flex-wrap:wrap; box-shadow:0 2px 6px rgba(0,0,0,.15); flex:0 0 auto;
  }
  header h1{ font-size:clamp(15px,1.7cqw,24px); font-weight:bold; flex:1; }
  header h1 .h-sub{ font-size:.8em; font-weight:normal; opacity:.9; margin-left:.4em; }
  header h1 .dao-logo{ height:clamp(36px,3.6cqw,52px); width:auto; vertical-align:middle; margin-left:.6em; }
  .hbtn{
    background:rgba(255,255,255,.22); color:#fff; font-weight:bold; border-radius:8px;
    padding:.55em 1.1em; font-size:clamp(12px,1.1cqw,16px);
  }
  .hbtn:active{ background:rgba(255,255,255,.4); }
  .hbtn:disabled{ opacity:.4; }

  /* ===== セットアップ画面 ===== */
  #setup-area{ flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
  .setup-card{
    background:#fff; border-radius:16px; padding:3cqh 3.5cqw; text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.08); max-width:640px;
  }
  .setup-card h2{ color:#e64a19; font-size:clamp(18px,2cqw,26px); margin-bottom:.8em; }
  .setup-row{ display:flex; align-items:center; justify-content:center; gap:.6em; margin-bottom:1em; flex-wrap:wrap; }
  .setup-row label{ font-weight:bold; font-size:clamp(14px,1.3cqw,17px); }
  .setup-row input[type=number]{
    border:2px solid #ffccbc; border-radius:8px; padding:.5em .6em; font-size:clamp(15px,1.4cqw,18px);
    font-weight:bold; text-align:center; width:6em;
  }
  .opt-box{ background:#fff8f2; border:2px solid #ffccbc; border-radius:12px; padding:1em 1.2em; margin:.6em 0 1.2em; text-align:left; }
  .opt-box h3{ font-size:clamp(13px,1.2cqw,16px); color:#8a5a3a; margin-bottom:.5em; }
  .opt{ display:flex; align-items:center; gap:.7em; padding:.45em 0; font-size:clamp(14px,1.3cqw,17px); font-weight:bold; cursor:pointer; }
  .opt input{ width:1.4em; height:1.4em; accent-color:#e64a19; }
  .opt small{ font-weight:normal; color:#8a5a3a; font-size:.8em; }
  .start-button{
    background:#ff5722; color:#fff; font-weight:bold; border-radius:10px;
    padding:.7em 2.2em; font-size:clamp(16px,1.6cqw,21px); box-shadow:0 4px 0 #bf360c;
  }
  .start-button:active{ transform:translateY(3px); box-shadow:0 1px 0 #bf360c; }
  .setup-note{ color:#a87d55; font-size:clamp(10px,1cqw,13px); margin-top:1.2em; }

  /* ===== メイン画面 ===== */
  #game-area{ display:none; flex:1; min-height:0; padding:1cqh 1cqw; }
  .dashboard{ display:flex; gap:1cqw; width:100%; height:100%; min-height:0; }
  .main-col{ flex:1 1 72%; min-width:0; display:flex; flex-direction:column; gap:.8cqh; min-height:0; }
  .side-col{ flex:0 0 23cqw; max-width:420px; display:flex; flex-direction:column; gap:.8cqh; min-height:0; }
  .card{ background:#fff; border-radius:14px; box-shadow:0 3px 10px rgba(0,0,0,.07); padding:.8cqh 1cqw; }

  /* プレイヤー見出し */
  .player-head{ display:flex; align-items:center; justify-content:center; gap:1.2cqw; flex:0 0 auto; flex-wrap:wrap; }
  .player-head input.pname{
    border:2px solid #ffccbc; border-radius:8px; padding:.25em .5em; font-size:clamp(12px,1.1cqw,15px);
    font-weight:bold; text-align:center; color:#d84315; width:7em; background:#fff8f2;
  }
  .player-head .lbl{ font-size:clamp(9px,.8cqw,11px); color:#8a5a3a; font-weight:bold; }
  .player-head .val{ font-size:clamp(38px,5cqw,66px); font-weight:bold; color:#bf360c; line-height:1; }
  .debt-badge{ background:#efebe9; color:#8a5a3a; border-radius:999px; padding:.4em 1em; font-weight:bold; font-size:clamp(11px,1.1cqw,15px); }
  .debt-badge.has{ background:#7b1fa2; color:#fff; }
  .masu-box{ display:flex; align-items:center; gap:.6em; background:#fff8f2; border:2px solid #ffccbc; border-radius:14px; padding:.3em .9em .3em .4em; min-height:3em; }
  .masu-pic{
    width:clamp(40px,4.2cqw,58px); height:clamp(40px,4.2cqw,58px); border-radius:50%; flex:0 0 auto;
    background-image:var(--board-img); background-repeat:no-repeat; background-color:#fff;
    box-shadow:0 1px 4px rgba(0,0,0,.2); border:2px solid #fff;
  }
  .masu-txt{ display:flex; flex-direction:column; line-height:1.3; }
  .masu-txt .m1{ font-weight:bold; color:#bf360c; font-size:clamp(12px,1.15cqw,16px); }
  .masu-txt .m2{ color:#8a5a3a; font-size:clamp(10px,.9cqw,12px); }
  .masu-box.empty .masu-pic{ display:none; }
  .masu-box.empty .m1{ color:#a87d55; font-weight:normal; }

  /* サイコロへ ＋ コマを戻す */
  .dice-row{ flex:0 0 auto; display:flex; gap:.8cqw; align-items:stretch; }
  .dice-go{
    flex:1; display:flex; align-items:center; justify-content:center; gap:1em;
    background:#ff6600; color:#fff; font-weight:bold; border-radius:12px;
    font-size:clamp(16px,1.8cqw,24px); padding:.4em 1em; box-shadow:0 4px 0 #bf4d00;
  }
  .dice-go:active:not(:disabled){ transform:translateY(3px); box-shadow:0 1px 0 #bf4d00; }
  .dice-go:disabled{ background:#c9b8ad; box-shadow:0 4px 0 #9c8a7d; }
  .dice-go .dg-sub{ font-size:.62em; font-weight:normal; background:rgba(255,255,255,.22); border-radius:999px; padding:.25em .9em; }
  .koma-back{
    flex:0 0 auto; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#8d6e63; color:#fff; font-weight:bold; border-radius:12px; padding:.3em 1.2em;
    font-size:clamp(12px,1.1cqw,16px); line-height:1.25; box-shadow:0 4px 0 #5d4037;
  }
  .koma-back:active:not(:disabled){ transform:translateY(3px); box-shadow:0 1px 0 #5d4037; }
  .koma-back:disabled{ opacity:.4; }
  .koma-back .kb-sub{ font-size:.75em; font-weight:normal; opacity:.9; }

  /* 山札の行 */
  .deck-row{ flex:0 0 auto; display:flex; gap:.8cqw; align-items:stretch; }
  .deck-box{
    display:flex; align-items:center; gap:.6em; background:#fff; border-radius:12px; padding:.5cqh .9cqw;
    box-shadow:0 3px 10px rgba(0,0,0,.07);
  }
  .deck-box.grow{ flex:1; }
  .deck-box .dk-pile{ position:relative; width:clamp(34px,3cqw,44px); aspect-ratio:var(--card-w)/var(--card-h); }
  .deck-box .dk-pile .pcard{ position:absolute; left:0; top:0; width:100%; }
  .deck-box .dk-txt{ display:flex; flex-direction:column; line-height:1.2; }
  .deck-box .dk-l{ font-size:clamp(9px,.85cqw,12px); color:#8a5a3a; font-weight:bold; }
  .deck-box .dk-n{ font-size:clamp(20px,2.2cqw,30px); font-weight:bold; color:#bf360c; line-height:1.05; }
  .deck-box .dk-n small{ font-size:.5em; color:#8a5a3a; margin-left:.15em; }
  .deck-box.mane{ background:#f3e5f5; }
  .mane-btns{ display:flex; gap:.5cqw; flex-wrap:wrap; }
  .mbtn{
    border-radius:9px; color:#fff; font-weight:bold; font-size:clamp(11px,1.05cqw,14px); padding:.45em .9em;
    box-shadow:0 3px 0 var(--sh); line-height:1.2; text-align:center;
  }
  .mbtn:active:not(:disabled){ transform:translateY(2px); box-shadow:0 1px 0 var(--sh); }
  .mbtn:disabled{ opacity:.35; }
  .mbtn.borrow{ background:#7b1fa2; --sh:#4a0072; }
  .mbtn.repay{ background:#2e7d32; --sh:#1b4d1e; }
  .mbtn.hoken{ background:#0288d1; --sh:#01579b; }
  .mbtn small{ display:block; font-weight:normal; font-size:.8em; opacity:.9; }
  /* たこ値上がりのバッジはヘッダーに置く。山札の行に入れていたころは、この1枚が入るだけで
     マネリテカード置き場が細くなってボタンが縦に折り返し、山札の行が太って場のカードの欄が潰れていた
     （2026-09-21 本人指摘「タコ値上がり中、カード残りの幅が広がって場が小さくなって見づらい」。
      スマホ縦持ち＋2トグルONでは 山札の行 92px→395px・アクション欄 106px→3px だった） */
  .takoup-badge{
    flex:0 0 auto; white-space:nowrap; background:#ffe0b2; color:#bf360c; border:2px solid #ffb74d;
    border-radius:999px; padding:.25em .9em; font-weight:bold; font-size:clamp(11px,1.05cqw,15px);
  }

  /* アクションエリア */
  .action-card{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
  /* 見出し＝題（折り返さない）＋説明（あまりを取って中で折り返す）＋ボタン（つねに右端）。
     spacer で右に寄せていたころは、説明文の長さしだいでボタンだけ次の行の左に落ちていた
     （2026-09-21 本人指摘：プレイヤー3だけ OPEN の「売らない」が画面左に出る） */
  .action-head{ display:flex; align-items:center; gap:.8em; flex-wrap:wrap; margin-bottom:.4cqh; }
  .action-head .ah-title{ flex:0 0 auto; font-size:clamp(14px,1.4cqw,19px); font-weight:bold; color:#bf360c; }
  .action-head .ah-sub{ flex:1 1 10em; min-width:0; font-size:clamp(11px,1cqw,14px); color:#8a5a3a; }
  .action-head .ah-btns{ flex:0 0 auto; margin-left:auto; display:flex; align-items:center; gap:.5em; }
  .action-body{ flex:1; min-height:0; overflow:auto; display:flex; align-items:flex-start; gap:1cqw; padding:.4cqh .2cqw; }
  .action-idle{ color:#a87d55; font-size:clamp(13px,1.2cqw,17px); align-self:center; margin:auto; text-align:center; line-height:1.6; }
  .abtn{
    border-radius:10px; color:#fff; font-weight:bold; font-size:clamp(13px,1.25cqw,17px); padding:.55em 1.2em;
    box-shadow:0 3px 0 var(--sh);
  }
  .abtn:active:not(:disabled){ transform:translateY(2px); box-shadow:0 1px 0 var(--sh); }
  .abtn:disabled{ opacity:.35; }
  .abtn.done{ background:#ff6600; --sh:#bf4d00; }
  .abtn.skip{ background:#8d6e63; --sh:#5d4037; }
  .abtn.ok{ background:#2e7d32; --sh:#1b4d1e; }

  /* カード */
  .pcard{
    aspect-ratio:var(--card-w)/var(--card-h); background-size:cover; background-position:center; border-radius:6%/3.6%;
    box-shadow:0 2px 5px rgba(0,0,0,.25); background-color:#fff;
  }
  .stack{ position:relative; flex:0 0 auto; cursor:default; }
  .stack .pcard{ position:absolute; left:0; }
  .stack .cnt{
    position:absolute; right:-6px; top:-6px; background:#e64a19; color:#fff; font-weight:bold; border-radius:999px;
    min-width:1.7em; height:1.7em; display:flex; align-items:center; justify-content:center; font-size:clamp(10px,1cqw,13px);
    box-shadow:0 1px 3px rgba(0,0,0,.3); z-index:5;
  }
  .stack .price{
    position:absolute; left:0; right:0; bottom:-1.5em; text-align:center; font-size:clamp(10px,1cqw,13px); font-weight:bold; color:#8a5a3a;
  }
  .stack .price.up{ color:#c62828; }
  .stack.buyable{ cursor:pointer; }
  .stack.buyable .pcard{ box-shadow:0 0 0 3px #ffb300, 0 2px 8px rgba(0,0,0,.3); }
  .stack.buyable:active .pcard{ transform:translateY(2px); }
  .stack.dim .pcard{ filter:grayscale(.6) brightness(.85); }
  .buy-grid{ display:flex; gap:1.2cqw; align-items:flex-start; flex-wrap:nowrap; padding:.3em .3em 1.6em; overflow-x:auto; overflow-y:hidden; width:100%; }
  /* 場のカード（仕入れ以外のときもアクション欄の左に出しておく） */
  .field-wrap{ flex:0 0 auto; display:flex; flex-direction:column; align-self:stretch; min-width:0; }
  .field-ttl{ flex:0 0 auto; font-size:clamp(10px,.95cqw,13px); color:#8a5a3a; font-weight:bold; margin:0 .4em; white-space:nowrap; }
  .buy-grid.field{ width:auto; }
  .field-empty{ color:#c2ac80; font-size:clamp(11px,1cqw,14px); padding:.6em .4em; }

  /* イベントカードめくり（表示は #eventOverlay の大画面。.fly のめくりでも使う） */
  .flip{ flex:0 0 auto; aspect-ratio:var(--card-w)/var(--card-h); perspective:900px; }
  .flip-inner{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .9s cubic-bezier(.4,.1,.2,1); }
  .flip.flipped .flip-inner{ transform:rotateY(180deg); }
  .flip .face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .flip .face.front{ transform:rotateY(180deg); }

  /* 仕入れ：山札からアクション欄の中央へカードの裏面が飛んできて、めくれる */
  #dealLayer{ position:fixed; inset:0; pointer-events:none; z-index:40; }
  .fly{
    position:absolute; opacity:1; filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));
    transition:left .55s cubic-bezier(.2,.7,.3,1), top .55s cubic-bezier(.2,.7,.3,1), width .55s cubic-bezier(.2,.7,.3,1), opacity .25s;
  }
  .fly .flip-inner{ transition:transform .7s cubic-bezier(.4,.1,.2,1); }
  .fly.fade{ opacity:0; }

  /* てっぱん（下） */
  .teppan-card{ flex:0 0 34cqh; min-height:0; display:flex; flex-direction:column; background:#fff7ec; }
  .teppan-cols{ display:flex; gap:1cqw; flex:1; min-height:0; }
  .menu-col{ flex:1 1 58%; min-width:0; overflow:auto; }
  .hand-col{ flex:1 1 42%; min-width:0; overflow:auto; border-left:2px dashed #ffccbc; padding-left:1cqw; }
  .sec-ttl{ font-size:clamp(11px,1.05cqw,14px); font-weight:bold; color:#8a5a3a; margin-bottom:.4cqh; display:flex; align-items:center; gap:.4em; flex:0 0 auto; }
  table.menu{ width:100%; border-collapse:collapse; }
  table.menu td{ padding:.25em .3em; border-bottom:1px dotted #ffe0b2; vertical-align:middle; font-size:clamp(11px,1.05cqw,14px); }
  table.menu td.mn{ font-weight:bold; color:#5a3a20; white-space:nowrap; }
  table.menu td.mp{ font-weight:bold; color:#bf360c; white-space:nowrap; text-align:right; }
  table.menu td.mr{ width:100%; }
  table.menu tr.ok td.mn::before{ content:"✅ "; }
  table.menu tr.ng td{ opacity:.55; }
  table.menu tr.lock td.mn::after{ content:" 🔒"; }
  .chips{ display:flex; gap:.25em; flex-wrap:wrap; align-items:center; }
  .chip{ position:relative; width:clamp(20px,1.9cqw,26px); height:clamp(20px,1.9cqw,26px); border-radius:50%; background-size:260%; background-position:center 38%; border:1.5px solid #fff; box-shadow:0 1px 2px rgba(0,0,0,.25); }
  .chip .x2{ position:absolute; right:-5px; bottom:-4px; background:#bf360c; color:#fff; font-size:9px; font-weight:bold; border-radius:999px; padding:0 .3em; line-height:1.3; }
  .sellbtn{ background:#2196F3; --sh:#1565a8; color:#fff; font-weight:bold; border-radius:8px; padding:.35em .8em; font-size:clamp(11px,1.05cqw,14px); box-shadow:0 3px 0 var(--sh); white-space:nowrap; }
  .sellbtn:active:not(:disabled){ transform:translateY(2px); box-shadow:0 1px 0 var(--sh); }
  .sellbtn:disabled{ opacity:.3; }
  .hand-grid{ display:flex; gap:.9cqw; flex-wrap:wrap; align-items:flex-start; padding:.3em .3em 1em; }
  .hand-grid .stack .name{ position:absolute; left:0; right:0; bottom:-1.4em; text-align:center; font-size:clamp(9px,.85cqw,11px); color:#8a5a3a; white-space:nowrap; }
  .hand-empty{ color:#c2ac80; font-size:clamp(11px,1cqw,14px); padding:.6em; }
  .hand-sec{ width:100%; font-size:clamp(10px,.9cqw,12px); color:#a87d55; font-weight:bold; border-top:1px dotted #ffccbc; padding-top:.3em; margin-top:.2em; }

  /* スコアボード・履歴 */
  .scoreboard-card{ flex:0 0 auto; }
  .scoreboard{ display:flex; flex-direction:column; gap:.5cqh; }
  .score-card{
    display:flex; align-items:center; justify-content:space-between; background:#fff3e0; border:2px solid #fff3e0;
    border-radius:10px; padding:.7cqh 1cqw; box-shadow:0 1px 4px rgba(0,0,0,.05); cursor:pointer;
  }
  .score-card.active{ border-color:#e64a19; background:#fff3ea; }
  .score-card .sc-name{ font-size:clamp(12px,1.05cqw,15px); font-weight:bold; color:#8a5a3a; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .score-card .sc-turn{ font-size:.8em; color:#e64a19; margin-right:.3em; }
  .score-card .sc-money{ font-size:clamp(13px,1.15cqw,16px); font-weight:bold; color:#bf360c; white-space:nowrap; }
  .score-card .sc-debt{ font-size:clamp(10px,.95cqw,13px); font-weight:bold; color:#7b1fa2; margin-left:.4em; }
  .score-card .sc-ins{ font-size:.85em; margin-left:.3em; }
  .history-card{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
  .history-list{ flex:1; min-height:0; overflow-y:auto; background:#fffde7; border:1px solid #ffe0b2; border-radius:10px; padding:.6cqh .8cqw; }
  .history-list p{ font-size:clamp(10px,.9cqw,13px); padding:.35em 0; border-bottom:1px dotted #ffe0b2; }
  .history-list p:last-child{ border-bottom:none; }
  .history-empty{ color:#c2ac80; font-size:clamp(11px,1cqw,14px); text-align:center; padding:1em 0; }

  /* 拡大表示（スマホ用。⊕ボタンは compact のときだけ出す） */
  .zoom-btn{
    display:none; margin-left:.35em; width:1.7em; height:1.7em; border-radius:50%; background:#ff6600; color:#fff; font-size:1.15em; line-height:1;
    align-items:center; justify-content:center; box-shadow:0 2px 0 #bf4d00; flex:0 0 auto; padding:0;
  }
  .zoom-btn:active{ transform:translateY(1px); box-shadow:0 1px 0 #bf4d00; }
  /* タブレットは画面が大きくて compact（max-height:520px）に入らないので ⊕ が出なかった（2026-09-21 本人指摘）。
     指で操作する端末（pointer:coarse）なら画面の大きさに関係なく出す。マウス・トラックパッドのPCは pointer:fine なので出ない
     （タッチパネル付きのノートPCも、主ポインタがトラックパッドなら fine） */
  @media (pointer:coarse){ .zoom-btn{ display:inline-flex; } }
  #zoomOverlay{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:45; padding:1.5cqh 1.5cqw; }
  #zoomOverlay.open{ display:flex; }
  .zoom-card{ flex:1; min-width:0; min-height:0; background:#fff7ec; border-radius:14px; box-shadow:0 6px 24px rgba(0,0,0,.25); display:flex; flex-direction:column; padding:.8cqh 1.2cqw; }
  .zoom-head{ display:flex; align-items:center; gap:.8em; flex:0 0 auto; margin-bottom:.5cqh; }
  .zoom-head .zoom-ttl{ flex:1; min-width:0; font-size:15px; font-weight:bold; color:#8a5a3a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .zoom-body{ flex:1; min-height:0; overflow:auto; padding:.3em .3em 1em; }
  .zoom-body table.menu{ zoom:1.5; }
  .zoom-body .hand-grid{ zoom:2.2; }

  /* イベントカードの大画面表示（2026-09-21 本人指示「表示内容が小さくてわかりにくい。一旦大画面で出して、
     受け取るボタンを押して再開」）。めくり（裏→表）もここでやる。「🎁 受け取る」で効果 →「次へ」でとじる */
  #eventOverlay{ position:fixed; inset:0; background:rgba(0,0,0,.62); display:none; align-items:center; justify-content:center; z-index:48; padding:2cqh 2cqw; }
  #eventOverlay.open{ display:flex; }
  .ev-big-card{
    background:#fff8f2; border-radius:18px; box-shadow:0 8px 30px rgba(0,0,0,.35); padding:2.5cqh 3cqw;
    display:flex; align-items:center; gap:3cqw; max-width:1100px; width:100%;
  }
  .ev-big-card .flip{ flex:0 0 auto; height:min(66cqh, 430px); width:auto; }
  .ev-big-side{ flex:1; min-width:0; display:flex; flex-direction:column; gap:1.4cqh; }
  .ev-big-name{ font-size:clamp(19px,2.7cqw,38px); font-weight:bold; color:#bf360c; line-height:1.25; }
  .ev-big-desc{ font-size:clamp(14px,1.7cqw,24px); color:#5a3a20; line-height:1.5; }
  .ev-big-result{ font-size:clamp(14px,1.8cqw,25px); font-weight:bold; color:#2e7d32; background:#fff; border:2px solid #a5d6a7; border-radius:12px; padding:.5em .8em; }
  .ev-big-btns{ display:flex; align-items:center; gap:1.5cqw; flex-wrap:wrap; }
  .ev-big-btns .abtn{ font-size:clamp(16px,1.9cqw,26px); padding:.6em 1.8em; }

  /* 閉店結果 */
  #resultOverlay{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:50; padding:2cqh 2cqw; }
  .result-card{ background:#fff; border-radius:16px; padding:3cqh 3cqw; box-shadow:0 6px 24px rgba(0,0,0,.25); max-width:760px; width:100%; max-height:90cqh; overflow-y:auto; text-align:center; }
  .result-card h2{ color:#e64a19; font-size:clamp(18px,2cqw,26px); margin-bottom:.5em; }
  .result-note{ color:#a87d55; font-size:clamp(10px,1cqw,13px); margin-bottom:1em; }
  .result-row{ display:flex; align-items:center; gap:.8em; flex-wrap:wrap; background:#fff3e0; border-radius:10px; padding:.7em 1em; margin-bottom:.5em; text-align:left; }
  .result-row.winner{ background:#fff9c4; border:2px solid #fbc02d; }
  .result-row .r-rank{ font-weight:bold; color:#8a5a3a; flex:0 0 3.5em; }
  .result-row .r-name{ font-weight:bold; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .result-row .r-money{ font-weight:bold; color:#bf360c; }
  .result-row .r-debt{ flex-basis:100%; font-size:.85em; color:#c62828; font-weight:bold; }
  .result-row.minus .r-money{ color:#c62828; }
  /* 閉店精算の明細（借金の強制返済・レンタル料）と、1人ずつの内訳 */
  .result-settle{ background:#f3e5f5; color:#4a0072; border-radius:10px; padding:.7em 1em; margin-bottom:.8em; text-align:left; font-size:clamp(11px,1cqw,14px); line-height:1.6; }
  .r-detail{ flex-basis:100%; border-top:1px dotted #e6c9a8; margin-top:.15em; padding-top:.4em; font-size:clamp(10px,.95cqw,13px); color:#6d4c41; line-height:1.6; }
  .result-card .start-button{ margin-top:.5em; }

  /* ===== サイコロ画面 ===== */
  #dice-area{ display:none; flex:1; min-height:0; flex-direction:column; align-items:center; justify-content:center; gap:1.4cqh; padding:1cqh 1cqw; }
  #board-container{
    position:relative; width:min(95cqw, 1000px, calc((100cqh - 150px) * 1.41)); aspect-ratio:1.41 / 1;
    background-image:var(--board-img); background-size:100% 100%; background-position:center; background-repeat:no-repeat;
    box-shadow:0 4px 15px rgba(0,0,0,.2); background-color:#fff; border-radius:10px;
  }
  #turn-label{
    position:absolute; left:56%; top:34.6%; transform:translateY(-50%); max-width:36%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    background:rgba(255,255,255,.94); border:3px solid #e64a19; color:#bf360c; font-weight:bold; font-size:clamp(13px,2.4cqw,26px);
    padding:.15em .7em; border-radius:999px; box-shadow:0 2px 6px rgba(0,0,0,.15); z-index:6;
  }
  #turn-label .tl-mark{ color:#e64a19; margin-right:.25em; }
  #highlight-circle{
    position:absolute; width:9%; aspect-ratio:1 / 1; border:5px solid #ff3333; border-radius:50%; transform:translate(-50%,-50%);
    display:none; z-index:5; box-sizing:border-box; box-shadow:0 0 10px #ff3333, inset 0 0 10px #ff3333;
  }
  #highlight-circle.pulse{ animation:hl-pulse .6s ease-in-out 2; }
  @keyframes hl-pulse{ 0%,100%{ transform:translate(-50%,-50%) scale(1); } 50%{ transform:translate(-50%,-50%) scale(1.35); } }
  #koma{
    position:absolute; width:9%; aspect-ratio:1 / 1; background-image:var(--koma-img); background-size:contain; background-position:center; background-repeat:no-repeat;
    filter:drop-shadow(2px 4px 5px rgba(0,0,0,.4)); transition:top .4s ease-in-out, left .4s ease-in-out; transform:translate(-50%,-50%); z-index:10;
  }
  #masu-zoom{ position:absolute; width:11%; aspect-ratio:1 / 1; display:none; z-index:30; transform:translate(-50%,-50%) scale(.6); transition:transform .5s cubic-bezier(.34,1.56,.64,1); }
  #masu-zoom.zoom{ transform:translate(-50%,-50%) scale(2.6); }
  #masu-zoom .mz-pic{ width:100%; height:100%; border-radius:50%; border:3px solid #ff3333; background-color:#fff; background-image:var(--board-img); background-repeat:no-repeat; box-shadow:0 0 0 2px #fff, 0 6px 16px rgba(0,0,0,.35); }
  #masu-zoom .mz-cap{ position:absolute; left:50%; bottom:-4%; transform:translateX(-50%); white-space:nowrap; background:#e64a19; color:#fff; font-weight:bold; font-size:clamp(5px,.75cqw,9px); padding:.2em .8em; border-radius:999px; box-shadow:0 1px 3px rgba(0,0,0,.3); border:1px solid #fff; }
  .scene{ position:absolute; top:50%; left:50%; width:120px; height:120px; transform:translate(-50%,-50%); perspective:600px; display:none; z-index:20; }
  .cube{ width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform 2s ease-out; }
  .cube__face{ position:absolute; width:120px; height:120px; background:#fffdfa; border:2px solid #ccc; border-radius:15px; font-size:100px; display:flex; justify-content:center; align-items:center; color:#333; box-sizing:border-box; }
  .cube__face--front  { color:#e60000; transform:rotateY(  0deg) translateZ(60px); }
  .cube__face--top    { transform:rotateX( 90deg) translateZ(60px); }
  .cube__face--right  { transform:rotateY( 90deg) translateZ(60px); }
  .cube__face--left   { transform:rotateY(-90deg) translateZ(60px); }
  .cube__face--bottom { transform:rotateX(-90deg) translateZ(60px); }
  .cube__face--back   { transform:rotateY(180deg) translateZ(60px); }
  .controls{ display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:14px 50px; max-width:95cqw; }
  /* 「サイコロを振る！」は盤面の真ん中（ベースのサイコロの上）に置く。画面の下だとタブレットで押しに行くのが遠い
     （2026-09-21 本人指示）。振っている間は同じ場所に3Dのサイコロが出るので、ボタンは消す */
  #roll-btn{
    position:absolute; left:50%; top:60%; transform:translate(-50%,-50%); z-index:15;   /* 60%＝ベースのサイコロの顔を隠さない位置 */
    padding:14px 50px; font-size:clamp(18px,2.2cqw,24px); font-weight:bold; background:#ff6600; color:#fff;
    border-radius:50px; box-shadow:0 6px 14px rgba(0,0,0,.3); transition:opacity .2s;
  }
  #roll-btn:active{ background:#e65c00; transform:translate(-50%,-50%) scale(.96); }
  #roll-btn:disabled{ opacity:0; pointer-events:none; }
  #back-btn{ padding:10px 30px; font-size:clamp(15px,1.6cqw,18px); background:#999; color:#fff; border-radius:50px; box-shadow:0 4px 6px rgba(0,0,0,.2); }
  #back-btn:active{ background:#777; }
  #back-btn:disabled{ opacity:.5; cursor:not-allowed; }

  /* ===== 画面の高さが小さいとき（スマホの横向き＝縦が390px前後）=====
     上の固定部分（ヘッダー・所持金・サイコロへ・山札の行）を詰めて、てっぱんの固定高さ（34cqh）をやめ、
     アクション欄とてっぱんで残りを分け合う。これが無いと仕入れ表の欄が十数pxしか残らず、カードが選べない */
  @container (max-height: 520px){
    header{ padding:.3cqh 1cqw; }
    header h1{ font-size:14px; }
    header h1 .dao-logo{ height:26px; }
    .hbtn{ padding:.35em .8em; font-size:12px; }
    .takoup-badge{ font-size:11px; padding:.2em .6em; }
    .takoup-badge .tu-until{ display:none; }   /* 狭い画面では「（〇〇の次の番まで）」を省いてヘッダーを1行に保つ */
    #game-area{ padding:.6cqh .8cqw; }
    .main-col, .side-col{ gap:.5cqh; }
    .card{ padding:.5cqh .8cqw; }
    .player-head{ gap:.8cqw; }
    .player-head .val{ font-size:30px; }
    .masu-box{ min-height:2.4em; padding:.15em .7em .15em .3em; }
    .masu-pic{ width:34px; height:34px; }
    .dice-go{ font-size:15px; padding:.25em .8em; }
    .koma-back{ font-size:11px; padding:.2em .8em; }
    .deck-box{ padding:.2cqh .6cqw; }
    .deck-box .dk-n{ font-size:18px; }
    .deck-box .dk-pile{ width:26px; }
    .mbtn{ font-size:10px; padding:.3em .6em; }
    .action-card{ flex:1.3 1 0; }
    /* アクション欄の見出しは1行に（説明文は…で省略）。3行に膨らんで仕入れ表の場所を食っていた（2026-09-19 本人指摘：場の下が見えない） */
    .action-head{ margin-bottom:.2cqh; flex-wrap:nowrap; gap:.5em; }
    .action-head .ah-title{ font-size:13px; white-space:nowrap; }
    .action-head .ah-sub{ flex:1 1 0; min-width:0; font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .abtn{ font-size:12px; padding:.4em .8em; white-space:nowrap; }
    /* 仕入れ表を横スクロールの入れ子にしない（スマホで縦スワイプが吸われて欄がスクロールできなくなる）。
       入りきらなければ折り返し、欄全体（.action-body）がスクロールする。下の余白も詰める（カードの高さは gridCardWidth が欄に合わせる） */
    .buy-grid{ flex-wrap:wrap; overflow:visible; padding:.2em .3em .4em; }
    .zoom-btn{ display:inline-flex; }   /* メニュー・手持ちカードの拡大ボタン（2026-09-19 本人指示：スマホだと見づらくスクロールもしにくい） */
    .teppan-card{ flex:1 1 0; }
    /* フェーズで配分を変える（render() が .dashboard に ph-〇〇 を付ける）：仕入れ・イベントはカードを見せたいのでアクション欄を広く、
       販売は「売る」ボタンがてっぱんにあるのでてっぱんを広く */
    .dashboard.ph-buy .action-card{ flex:2 1 0; }
    .dashboard.ph-event .action-card{ flex:1.6 1 0; }
    .dashboard.ph-sell .action-card{ flex:0 1 auto; }
    .dashboard.ph-sell .teppan-card{ min-height:45%; }
    table.menu td{ padding:.12em .3em; }
    #dice-area{ gap:.8cqh; padding:.6cqh 1cqw; }
    /* イベントカードの大画面表示（狭い画面用） */
    .ev-big-card{ padding:1.5cqh 2cqw; gap:2.5cqw; }
    .ev-big-card .flip{ height:min(72cqh, 260px); }
    .ev-big-name{ font-size:17px; }
    .ev-big-desc{ font-size:13px; }
    .ev-big-result{ font-size:13px; padding:.4em .6em; }
    .ev-big-btns .abtn{ font-size:14px; padding:.5em 1.2em; }
    #board-container{ width:min(95cqw, 1000px, calc((100cqh - 110px) * 1.41)); }
    #turn-label{ font-size:12px; padding:.1em .5em; border-width:2px; }   /* 盤面が小さいので「▶ プレイヤー1 の番」が入る大きさに */
    .controls{ gap:8px 30px; }
    #roll-btn{ padding:8px 36px; }
    #back-btn{ padding:6px 22px; }
  }
</style>
</head>
<body>
<div id="app">

<header>
  <h1>🐙 たこ焼き屋さんゲーム<span class="h-sub" id="hSub"></span><img class="dao-logo" src="dao-logo.png" alt="マネリテDAO"></h1>
  <span class="takoup-badge" id="takoUpBadge" style="display:none;">🐙 たこ値上がり中 +30円<span class="tu-until" id="takoUpUntil"></span></span>
  <button class="hbtn" id="undoBtn" style="display:none;">🔙 収支を1つ戻す</button>
  <button class="hbtn" id="closeDayBtn" style="display:none;">🏁 閉店精算</button>
  <button class="hbtn" id="resetBtn" style="display:none;">🔄 リセット</button>
</header>

<div id="setup-area">
  <div class="setup-card">
    <h2>ゲームの準備（ブラウザ完結版）</h2>
    <div class="setup-row">
      <label for="player-count-input">プレイヤー人数（3〜5人）</label>
      <input type="number" id="player-count-input" value="4" min="3" max="5">
    </div>
    <div class="setup-row">
      <label for="init-money-input">はじめの所持金</label>
      <input type="number" id="init-money-input" value="390" min="0" step="10">
      <span>円</span>
    </div>
    <div class="opt-box">
      <h3>🚀 バージョンアップ ルール</h3>
      <label class="opt"><input type="checkbox" id="optLoan">仕入れに借金券を使える<small>（未返済3枚まで。OFFでもイベントの支払いが足りないときは自動で借りる）</small></label>
      <label class="opt"><input type="checkbox" id="optHoken">保険カード（50円）<small>（イベント以外のマスに止まったとき買える。テッパン修理を1回ふせぐ）</small></label>
    </div>
    <button class="start-button" id="startBtn">ゲーム開始</button>
    <div class="setup-note">材料カード・イベントカード・てっぱんシートを画面の中で使う版。実物カードは要りません。</div>
  </div>
</div>

<div id="game-area">
  <div class="dashboard">
    <div class="main-col">

      <div class="player-head">
        <input class="pname" id="apName" maxlength="12">
        <span class="lbl">所持金</span>
        <span class="val" id="apMoney">¥0</span>
        <span class="debt-badge" id="apDebt">💳 借金なし</span>
        <div class="masu-box empty" id="masuBox">
          <div class="masu-pic" id="masuPic"></div>
          <div class="masu-txt"><span class="m1" id="masuM1">まだサイコロを振っていません</span><span class="m2" id="masuM2"></span></div>
        </div>
      </div>

      <div class="dice-row">
        <button class="dice-go" id="diceGoBtn">🎲 サイコロへ<span class="dg-sub" id="diceGoSub"></span></button>
        <button class="koma-back" id="komaBackBtn">↩ サイコロのコマを戻す<span class="kb-sub" id="komaBackSub">直前の移動を取り消す</span></button>
      </div>

      <div class="deck-row">
        <div class="deck-box">
          <div class="dk-pile" id="deckPile"></div>
          <div class="dk-txt"><span class="dk-l">材料カードの山札</span><span class="dk-n" id="deckCount">0<small>枚</small></span></div>
        </div>
        <div class="deck-box">
          <div class="dk-txt"><span class="dk-l">場のカード</span><span class="dk-n" id="fieldCount">0<small>枚</small></span></div>
        </div>
        <div class="deck-box">
          <div class="dk-pile" id="evPile"></div>
          <div class="dk-txt"><span class="dk-l">イベントカード</span><span class="dk-n" id="evCount">0<small>枚</small></span></div>
        </div>
        <div class="deck-box mane grow">
          <div class="dk-txt"><span class="dk-l">マネリテカード置き場</span><span class="dk-n" id="maneInfo" style="font-size:clamp(11px,1cqw,14px);color:#4a0072;"></span></div>
          <div class="mane-btns">
            <button class="mbtn borrow" id="borrowBtn">借金券で借りる<small>＋100円（返すのは110円）</small></button>
            <button class="mbtn repay" id="repayBtn">借金券を返す<small>−110円</small></button>
            <button class="mbtn hoken" id="hokenBtn">保険カードを買う<small>−50円</small></button>
          </div>
        </div>
      </div>

      <div class="card action-card">
        <div class="action-head" id="actionHead"></div>
        <div class="action-body" id="actionBody"></div>
      </div>

      <div class="card teppan-card">
        <div class="teppan-cols">
          <div class="menu-col">
            <div class="sec-ttl">🍳 てっぱんシート（メニュー）<button class="zoom-btn" id="menuZoomBtn" title="大きく表示">⊕</button><span id="menuHint" style="font-weight:normal;color:#a87d55;"></span></div>
            <table class="menu" id="menuTable"></table>
          </div>
          <div class="hand-col">
            <div class="sec-ttl">🃏 <span id="handTitle">手持ちのカード</span><button class="zoom-btn" id="handZoomBtn" title="大きく表示">⊕</button></div>
            <div class="hand-grid" id="handGrid"></div>
          </div>
        </div>
      </div>

    </div>

    <div class="side-col">
      <div class="card scoreboard-card">
        <div class="sec-ttl">👥 プレイヤー</div>
        <div class="scoreboard" id="scoreboard"></div>
      </div>
      <div class="card history-card">
        <div class="sec-ttl">📒 履歴</div>
        <div class="history-list" id="historyList"></div>
      </div>
    </div>
  </div>
</div>

<div id="dice-area">
  <div id="board-container">
    <div id="turn-label"><span class="tl-mark">▶</span><span id="turnName"></span> の番</div>
    <div id="highlight-circle"></div>
    <div id="koma"></div>
    <div id="masu-zoom"><div class="mz-pic" id="mzPic"></div><div class="mz-cap" id="mzCap"></div></div>
    <div class="scene" id="dice-scene">
      <div class="cube" id="dice">
        <div class="cube__face cube__face--front">⚀</div>
        <div class="cube__face cube__face--top">⚁</div>
        <div class="cube__face cube__face--right">⚂</div>
        <div class="cube__face cube__face--left">⚃</div>
        <div class="cube__face cube__face--bottom">⚄</div>
        <div class="cube__face cube__face--back">⚅</div>
      </div>
    </div>
    <button id="roll-btn">サイコロを振る！</button>
  </div>
  <div class="controls">
    <button id="back-btn">1つ戻る</button>
  </div>
</div>

<div id="dealLayer"></div>

<!-- 拡大表示（スマホ用）：メニュー表／手持ちカードの要素をここに移して大きく見せる。とじると元の場所に戻す -->
<div id="zoomOverlay">
  <div class="zoom-card">
    <div class="zoom-head"><span class="zoom-ttl" id="zoomTitle"></span><button class="abtn skip" id="zoomCloseBtn">✕ とじる</button></div>
    <div class="zoom-body" id="zoomBody"></div>
  </div>
</div>

<!-- イベントカードの大画面表示。めくり終わると「🎁 受け取る」が押せるようになり、効果のあと「次へ」でとじて再開する -->
<div id="eventOverlay">
  <div class="ev-big-card">
    <div class="flip" id="evFlip"><div class="flip-inner" id="evFlipInner"></div></div>
    <div class="ev-big-side">
      <div class="ev-big-name" id="evBigName"></div>
      <div class="ev-big-desc" id="evBigDesc"></div>
      <div class="ev-big-result" id="evBigResult" style="display:none;"></div>
      <div class="ev-big-btns" id="evBigBtns"></div>
    </div>
  </div>
</div>

<div id="resultOverlay">
  <div class="result-card">
    <h2>🏁 閉店！ 結果発表</h2>
    <div class="result-note">未返済の借金券は閉店のときに全部返します（1枚110円）。順位は、そのあとの所持金で決まります</div>
    <div id="resultList"></div>
    <button class="start-button" id="resultCloseBtn">とじる</button>
  </div>
</div>

</div><!-- /#app -->

<script>
// スマホ・タブレットを縦に持っているときは #app を90度回して横向きに表示する。横向きに持ち直してブラウザ自体が横になれば回転は外れる。
// URLに ?norot を付けると回さない、?rot で強制（headless Edge のテスト用）。回転中は window.__rot が true
(function(){
  var app = document.getElementById('app'), q = location.search;
  var force = /[?&]rot(&|$)/.test(q), off = /[?&]norot(&|$)/.test(q);
  function portrait(){
    var o = screen.orientation && screen.orientation.type;
    return o ? o.indexOf('portrait') === 0 : window.innerHeight > window.innerWidth;
  }
  function touch(){ return (window.matchMedia && matchMedia('(pointer:coarse)').matches) || navigator.maxTouchPoints > 0; }
  function apply(){
    var w = window.innerWidth, h = window.innerHeight;
    var on = !off && (force || (touch() && portrait() && h > w));
    app.classList.toggle('rot', on);
    app.style.setProperty('--rot-w', h + 'px'); app.style.setProperty('--rot-h', w + 'px');
    window.__rot = on;
  }
  apply();
  window.addEventListener('resize', apply);
  if(screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', apply);
  window.addEventListener('orientationchange', function(){ setTimeout(apply, 100); });
})();
</script>

  // ===== 画面切り替え =====

  // ===== お金 =====
  // 支払い。足りなければ借金券（100円単位）を自動で発行して払う
  function pay(pi, amount, label){
    var p = players[pi];
    if(p.money < amount){
      var units = Math.ceil((amount - p.money) / LOAN_UNIT);
      p.debt += units; p.money += units * LOAN_UNIT;
      st(p).borrow += 1; st(p).borrowCards += units;
      log(pi, '🏦 ' + label + 'のお金が足りないので、借金券' + units + '枚（' + (units*LOAN_UNIT) + '円）を自動で借りた（未返済 ' + p.debt + '枚）');
    }
    p.money -= amount;
    log(pi, label + 'で −' + amount + '円（残高 ' + yen(p.money) + '）');
  }
  function borrow(){
    var p = cur();

    pushUndo();
    p.debt += 1; p.money += LOAN_UNIT;
    st(p).borrow += 1; st(p).borrowCards += 1;
    log(activeIndex, '🏦 借金券で' + LOAN_UNIT + '円借りた（未返済 ' + p.debt + '枚）（残高 ' + yen(p.money) + '）');
    render();
  }
  function repay(){

    render();
  }
  function buyHoken(){

    render();
  }
  function canBuyHoken(){

  }

  // ===== 仕入れ =====
  function matPrice(id){ return MAT[id].price + (id === 'tako' && takoUpBy !== null ? TAKO_UP : 0); }

    phase = 'buy';
    if(!isFinal){
      log(turnIndex, '🛒 山札から' + opened.length + '枚オープン' + (opened.length ? '（' + opened.map(function(i){ return MAT[i].name; }).join('・') + '）' : '（山札がもうない）'));
      if(deck.length === 0) logAll('📢 材料カードの山札がなくなった！ この仕入れが終わったら、最後の仕入れ→最後の販売→閉店 に進みます');

  }
  function endBuy(){

  // ===== 販売 =====
  function craftable(p, m){
    if(m.dev && !p.dev) return false;
    var short = 0;
    for(var id in m.need){ short += Math.max(0, m.need[id] - (p.mats[id]||0)); }
    return short <= (p.mats.magic||0);
  }
  // 履歴用の短い名前：「SNSでバズってお客さんがふえた」→「SNSでバズって」、「テレビに出て話題に」→「テレビに出て」（「て」の無い名前はそのまま）
  function plusShort(id){ return EVENTS[id].name.replace(/て.*$/, 'て'); }
  function sell(m){

    var used = [];

      p.mats[id] = have - take; if(take) used.push(MAT[id].name + (take>1?'×'+take:''));
      var short = m.need[id] - take;
      if(short){ p.mats.magic -= short; used.push('まほうの材料' + (short>1?'×'+short:'') + '→' + MAT[id].name); }
    });
    // プラスのイベントカードは 1品につき1枚、金額の高いものから自動で使う。余りは次のOPENへ持ち越し（2026-09-18 本人指定）
    var bonus = 0, bonusName = '';
    if(p.plus.length){
      var best = 0;
      for(var bi=1; bi<p.plus.length; bi++){ if(EVENTS[p.plus[bi]].bonus > EVENTS[p.plus[best]].bonus) best = bi; }

      + '（残高 ' + yen(p.money) + '）' + (bonus && p.plus.length ? '　プラスカード のこり' + p.plus.length + '枚' : ''));

  }
  function endSell(){

      sellState = null; phase = 'idle';

    }
  }

  }

    return shuffle(d);
  }
  function startEvent(){
    var id = eventDeck.pop();
    eventState = { id: id, applied: false, flipped: false };
    phase = 'event';
    log(turnIndex, '🃏 イベントカードを引いた：「' + EVENTS[id].name + '」');
    if(eventDeck.length === 0){ eventDeck = newEventDeck(); logAll('🃏 イベントカードが0枚になったので、21枚に戻してシャッフルした'); }
  }
  function applyEvent(){
    if(phase !== 'event' || !eventState || eventState.applied) return;
    pushUndo();
    var id = eventState.id, ev = EVENTS[id], p = players[turnIndex], res = '';
    if(ev.kind === 'plus'){ p.plus.push(id); res = '手元に持った（次に売るとき ＋' + ev.bonus + '円）'; }
    else if(ev.kind === 'dev'){ p.dev = true; res = 'チーズクレープが売れるようになった'; }

      st(p).repair += 1;

  // ===== 手番の流れ =====

      var q = []; for(var i=1;i<=players.length;i++) q.push((turnIndex + i) % players.length);
      endgame = { step:'lastBuy', queue:q, pos:0 };
      logAll('🏁 最後の仕入れ（1人1枚・場のカードから）を ' + players[q[0]].name + ' から順に行います');
      activeIndex = q[0]; startBuy(1, true);

    }
    if(endgame){
      if(endgame.step === 'lastBuy'){

        if(endgame.pos < endgame.queue.length){ activeIndex = endgame.queue[endgame.pos]; startBuy(1, true); }
        else { endgame.step = 'lastSell'; logAll('🏁 最後の販売：全員が順番にたこ焼きを売れます'); startSell(endgame.queue.slice(), true); }
      } else if(endgame.step === 'lastSell'){

  function goDice(){

  function moveKoma(steps){

  function landed(dice, from){

  // ===== 閉店 =====
  // 閉店精算＝①未返済の借金券をここで全部返す（強制。1枚110円）→②全員が鉄板レンタル料300円→③結果発表。

  function payFinal(pi, amount, label){

  function closeDay(){

    var debtors = players.map(function(p, i){ return { i:i, name:p.name, n:p.debt, cost:p.debt * LOAN_REPAY }; })
                         .filter(function(d){ return d.n > 0; });

           + debtors.map(function(d){ return '　・' + d.name + '：' + d.n + '枚 → −' + d.cost + '円'; }).join('\n') + '\n'

  // 結果発表。順位のあとに、1人ずつ明細（売ったメニュー・鉄板が壊れた回数・借金の回数・余った材料費など）を出す
  function resultDetail(p){
    var s = st(p), out = [];
    var soldList = MENU.filter(function(m){ return s.sold[m.id]; });
    var soldN = soldList.reduce(function(t, m){ return t + s.sold[m.id]; }, 0);
    out.push('🍳 売ったたこ焼き：' + (soldN
      ? soldList.map(function(m){ return esc(m.name) + '×' + s.sold[m.id]; }).join('、') + '（' + soldN + '品）　売上 ' + yen(s.sales)
        + (s.bonus ? '＋イベントカード ' + yen(s.bonus) : '')
      : 'なし'));

      + (s.repayYen ? '　返したお金 ' + yen(s.repayYen) : '')
      + (s.forcedRepay ? '（うち閉店で強制返済 ' + yen(s.forcedRepay) + '）' : ''));

  }

    if(count > 1){ var b = document.createElement('span'); b.className = 'cnt'; b.textContent = count; s.appendChild(b); }
    if(opts.label){ var l = document.createElement('span'); l.className = opts.labelCls || 'price'; l.textContent = opts.label; s.appendChild(l); }

  // カードの幅はアクション欄の高さから決める（重ねた分と値段ラベルを引いて、はみ出さない大きさ）。extra＝さらに引く高さ（見出し分など）
  // 高さが小さい画面（スマホの横向き）か。CSSの @container (max-height:520px) と同じ条件
  function compact(){ return appEl.clientHeight <= 520; }
  // 仕入れ表のカード幅：欄の高さに収まる幅（ラベルと余白の分を引く。compact ではラベルの余白が小さいので引く量も小さい）と、
  // 欄の横幅に n 個並ぶ幅のうち小さい方。スマホでは最小40pxまで小さくして、スクロールしなくても全部見えるようにする
  function gridCardWidth(stacks, extra){
    var maxStack = stacks.reduce(function(m, c){ return Math.max(m, c); }, 1), n = stacks.length || 1;
    var avail = actionBody.clientHeight - (compact() ? 32 : 46) - (extra || 0);

    var gap = Math.round(appEl.clientWidth * 0.012);

    var fc = {}; field.forEach(function(id){ fc[id] = (fc[id]||0) + 1; });

    var g = document.createElement('div'); g.className = 'buy-grid field';

  function rectL(el){
    var r = el.getBoundingClientRect();
    if(!window.__rot) return r;
    var H = appEl.offsetHeight;   // 回転時の #app の高さ＝画面の実際の幅

    var extras = [];
    var pc = {}; p.plus.forEach(function(e){ pc[e] = (pc[e]||0) + 1; });
    Object.keys(pc).forEach(function(e){ extras.push(stackEl(e, pc[e], w, { label: '＋' + EVENTS[e].bonus + '円', labelCls: 'name' })); });
    if(p.dev) extras.push(stackEl('dev', 1, w, { label: '商品開発', labelCls: 'name' }));
    if(p.insurance) extras.push(stackEl('hoken', 1, w, { label: '保険', labelCls: 'name' }));
    if(p.debt) extras.push(stackEl('loan', p.debt, w, { label: '借金券', labelCls: 'name' }));
    if(extras.length){ var sec = document.createElement('div'); sec.className = 'hand-sec'; sec.textContent = 'イベント・マネリテカード'; handGrid.appendChild(sec); extras.forEach(function(x){ handGrid.appendChild(x); }); }
  }
  function renderScoreboard(){
    scoreboardEl.innerHTML = '';
    players.forEach(function(p, i){
      var card = document.createElement('div');
      card.className = 'score-card' + (i === activeIndex ? ' active' : '');
      var mats = 0; for(var k in p.mats) mats += p.mats[k];
      card.innerHTML = '<span class="sc-name">' + (i === turnIndex ? '<span class="sc-turn">🎲</span>' : '') + esc(p.name) + ' <small style="font-weight:normal;color:#a87d55;">材料' + mats + '</small></span>'
        + '<span class="sc-money">' + yen(p.money) + (p.debt ? '<span class="sc-debt">💳' + p.debt + '</span>' : '') + (p.insurance ? '<span class="sc-ins">☂</span>' : '') + '</span>';
      card.addEventListener('click', function(){ if(phase === 'sell' || phase === 'buy') return; activeIndex = i; render(); });
      scoreboardEl.appendChild(card);
    });
  }
  function renderHistory(){
    var p = cur(); historyListEl.innerHTML = '';
    if(!p.history.length){ var e = document.createElement('div'); e.className = 'history-empty'; e.textContent = 'まだ きろくがないよ'; historyListEl.appendChild(e); return; }
    p.history.slice(-40).reverse().forEach(function(m){ var row = document.createElement('p'); row.textContent = m; historyListEl.appendChild(row); });
  }
  function render(){
    if(!players.length) return;
    dashboardEl.className = 'dashboard ph-' + phase;   // 画面の高さが小さいときの高さ配分に使う（CSSの @container 内）
    renderHead(); renderButtons(); renderDecks(); renderAction(); renderTeppan(); renderScoreboard(); renderHistory();
  }

  // ===== サイコロ画面の部品 =====
  function updateKomaPosition(){ var pos = pathCoordinates[currentPosition]; koma.style.left = pos.x + '%'; koma.style.top = pos.y + '%'; }
  function showHighlight(pulse){ var pos = pathCoordinates[currentPosition]; highlightCircle.style.left = pos.x + '%'; highlightCircle.style.top = pos.y + '%'; highlightCircle.style.display = 'block'; highlightCircle.className = pulse ? 'pulse' : ''; }
  // 「▶ 〇〇 の番」ラベル。スマホだと盤面が小さくて入りきらず「プレイヤ…」になるので、収まるまで文字を小さくする（9pxまで）。
  // ヘッダーにも同じ名前を出しておく（2026-09-19 本人指摘：何番目か分からない）
  function updateTurnLabel(){
    var name = players[turnIndex] ? players[turnIndex].name : '';
    turnNameEl.textContent = name;
    fitTurnLabel();
    if(diceArea.style.display !== 'none') hSub.textContent = 'サイコロ ▶ ' + name + ' の番';
  }
  function fitTurnLabel(){
    turnLabel.style.fontSize = '';
    var size = parseFloat(getComputedStyle(turnLabel).fontSize);
    while(turnLabel.scrollWidth > turnLabel.clientWidth && size > 9){ size -= 1; turnLabel.style.fontSize = size + 'px'; }
  }
  function showMasuZoom(pos){
    var c = pathCoordinates[pos];
    masuZoom.style.left = c.x + '%'; masuZoom.style.top = c.y + '%';
    masuZoom.classList.remove('zoom'); masuZoom.style.display = 'block';
    setMasuPic(mzPic, pos); mzCap.textContent = masuInfo(pos).title;
    void masuZoom.offsetWidth; masuZoom.classList.add('zoom');
  }
  function hideMasuZoom(){ masuZoom.classList.remove('zoom'); masuZoom.style.display = 'none'; }

  // ===== 開始・リセット =====
  function startGame(){
    var count = parseInt($('player-count-input').value, 10);
    if(isNaN(count) || count < 3 || count > 5){ alert('プレイヤー人数は3人から5人の間で選択してください。'); return; }
    var initMoney = parseInt($('init-money-input').value, 10); if(isNaN(initMoney) || initMoney < 0) initMoney = 390;
    options = { loan: $('optLoan').checked, hoken: $('optHoken').checked };
    players = []; undoStack = []; activeIndex = 0; turnIndex = 0; awaitingNext = false; enteredAdvanced = false;
    currentPosition = 0; lastLanded = null; komaStack = []; rolling = false; landSnap = null; landUndoLen = 0;
    phase = 'idle'; buyState = null; eventState = null; sellState = null; endgame = null; takoUpBy = null; closeSettle = null;
    insuranceStock = options.hoken ? count : 0;
    deck = []; MAT_ORDER.forEach(function(id){ for(var i=0;i<MAT[id].n;i++) deck.push(id); }); shuffle(deck);
    eventDeck = newEventDeck();
    for(var i=0;i<count;i++){
      var mats = {}; MAT_ORDER.forEach(function(id){ mats[id] = 0; });
      players.push({ name:'プレイヤー'+(i+1), money:initMoney, debt:0, insurance:false, dev:false, mats:mats, plus:[],
        stats:{ sold:{}, sales:0, bonus:0, buys:0, buyCost:0, repair:0, repairSaved:0, borrow:0, borrowCards:0, repay:0, repayYen:0, hoken:0 },
        history:['ゲーム開始！ 所持金'+initMoney+'円です。'] });
    }
    // 配りもの：全員にきじたん1・ソースたん1（山札から抜く）、場に2枚オープン
    players.forEach(function(p, i){
      ['kiji','sauce'].forEach(function(id){ var k = deck.indexOf(id); if(k >= 0){ deck.splice(k, 1); p.mats[id] += 1; } });
      log(i, '🎁 はじめの材料：きじたん1枚・ソースたん1枚をもらった');
    });
    field = drawMats(2);
    logAll('🃏 山札から2枚を場にオープン（' + field.map(function(i){ return MAT[i].name; }).join('・') + '）。仕入れのときに買えます');
    logAll('⚙ ルール：仕入れの借金券 ' + (options.loan ? 'あり' : 'なし') + '／保険カード ' + (options.hoken ? 'あり' : 'なし'));
    hideMasuZoom(); cancelDeal(); updateKomaPosition();
    showScreen('game'); render();
  }
  function resetGame(){
    if(!confirm('ゲームをリセットしますか？全員のデータが失われます。')) return;
    resultOverlay.style.display = 'none';
    players = []; undoStack = []; komaStack = []; phase = 'idle'; endgame = null; closeSettle = null; hideMasuZoom(); cancelDeal();
    $('player-count-input').value = 4; $('init-money-input').value = 390;
    showScreen('setup');
  }

  // ===== 拡大表示（スマホ用）=====
  // メニュー表／手持ちカードの要素そのものをオーバーレイに移して大きく見せる（「売る」ボタンもそのまま押せる）。とじると元の場所に戻す。
  // 画面が切り替わるとき（showScreen）は自動でとじる
  var zoomOverlay = $('zoomOverlay'), zoomBody = $('zoomBody'), zoomTitle = $('zoomTitle'), zoomState = null;
  function openZoom(el, title){
    if(zoomState) closeZoom();
    zoomState = { el:el, parent:el.parentNode, next:el.nextSibling };
    zoomTitle.textContent = title; zoomBody.appendChild(el); zoomOverlay.classList.add('open');
  }
  function closeZoom(){
    if(!zoomState) return;
    zoomState.parent.insertBefore(zoomState.el, zoomState.next);
    zoomState = null; zoomOverlay.classList.remove('open');
  }
  $('menuZoomBtn').addEventListener('click', function(){ openZoom(menuTable, '🍳 てっぱんシート（メニュー）' + menuHint.textContent); });
  $('handZoomBtn').addEventListener('click', function(){ openZoom(handGrid, '🃏 ' + handTitle.textContent); });
  $('zoomCloseBtn').addEventListener('click', closeZoom);
  zoomOverlay.addEventListener('click', function(e){ if(e.target === zoomOverlay) closeZoom(); });

  // ===== イベント登録 =====
  apNameEl.addEventListener('change', function(){ var v = apNameEl.value.trim(); cur().name = v || ('プレイヤー' + (activeIndex+1)); render(); });
  undoBtn.addEventListener('click', undo);
  borrowBtn.addEventListener('click', borrow);
  repayBtn.addEventListener('click', repay);
  hokenBtn.addEventListener('click', buyHoken);
  closeDayBtn.addEventListener('click', closeDay);
  diceGoBtn.addEventListener('click', goDice);
  komaBackBtn.addEventListener('click', komaBack);
  rollBtn.addEventListener('click', rollDice);
  backBtn.addEventListener('click', diceBack);
  resetBtn.addEventListener('click', resetGame);
  $('startBtn').addEventListener('click', startGame);
  $('resultCloseBtn').addEventListener('click', function(){ resultOverlay.style.display = 'none'; });
  window.addEventListener('resize', function(){ if(players.length && gameArea.style.display !== 'none') render(); fitTurnLabel(); });
  window.addEventListener('beforeunload', function(e){ if(players.length === 0) return; e.preventDefault(); e.returnValue = 'ゲームのデータが失われます'; return 'ゲームのデータが失われます'; });

  showScreen('setup');

  // テスト用（headlessから状態を読む・書き換える）
  window.__state = function(){ return { phase:phase, turn:turnIndex, active:activeIndex, deck:deck.length, field:field.slice(), ev:eventDeck.length, players:players, buy:buyState, sell:sellState, event:eventState, endgame:endgame, takoUpBy:takoUpBy, stock:insuranceStock, undo:undoStack.length, pos:currentPosition }; };
  window.__mutate = function(fn){ fn({ players:players, deck:deck, field:field, eventDeck:eventDeck }); render(); };
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
